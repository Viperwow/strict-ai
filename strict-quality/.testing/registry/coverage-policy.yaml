# Minimum thresholds by effective severity (ADR-003). Diff-on-PR applies to touched (S,L) files.

by_severity:
  V0:
    line: 90
    branch: 80
    diff_line: 95
  V1:
    line: 80
    branch: 70
    diff_line: 85
  V2:
    line: 70
    branch: 60
    diff_line: 75
  V3:
    line: 50
    branch: 40
    diff_line: optional
