# Canonical layers (L-*). Paths are relative to each scope root unless overridden in scopes.yaml.

layers:
  - id: L-dom
    name: domain
    description: Pure business rules, entities, invariants without I/O.
  - id: L-app
    name: application
    description: Use cases, orchestration, transaction boundaries.
  - id: L-api
    name: api
    description: HTTP/gRPC handlers, DTO validation, public contracts.
  - id: L-inf
    name: infrastructure
    description: Persistence, messaging, external adapters.
  - id: L-ui
    name: ui
    description: User-facing components, pages, client state.
